# HasFlagExtension
# by KryKom with love and care :)

name: Test HasFlagExtension

on:
  push:
    paths:
      - 'Src/**'
      - 'Tests/**'
      - 'Samples/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Src/**'
      - 'Tests/**'
      - 'Samples/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest 

    env:
      SolutionPath: ./HasFlagExtension.slnx
      TestProjectPath: ./Tests/HasFlagExtension.Tests.csproj
      SampleProjectPath: ./Samples/HasFlagExtension.Sample.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ${{ env.SolutionPath }}

    - name: Build solution
      run: dotnet build ${{ env.SolutionPath }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Execute unit tests
      run: dotnet test ${{ env.TestProjectPath }} --configuration ${{ matrix.configuration }} --no-build

    - name: Run sample application
      run: dotnet run --project ${{ env.SampleProjectPath }} --configuration ${{ matrix.configuration }} --no-build
