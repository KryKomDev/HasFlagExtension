name: Publish and release HasFlagExtension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (overrides csproj, e.g. 1.2.3)'
        required: false
        type: string

env:
  SolutionPath: ./HasFlagExtension.slnx
  SolutionName: ./HasFlagExtension.slnx
  ProjectPath: ./Src/Generator/HasFlagExtension.Generator.csproj
  TestProjectPath: ./Tests/HasFlagExtension.Tests.csproj
  SampleProjectPath: ./Samples/HasFlagExtension.Sample.csproj
  NugetOutputDir: ./nupkg/

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.SolutionPath }} --ignore-failed-sources

    - name: Get version
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Extract version from tag (strip 'v' prefix if present)
          VERSION="${GITHUB_REF_NAME#v}"
        elif [[ -n "${{ inputs.version }}" ]]; then
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
        else
          VERSION=""
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build solution
      run: dotnet build ${{ env.SolutionPath }} --configuration Release --no-restore

    - name: Execute unit tests
      run: dotnet test ${{ env.TestProjectPath }} --configuration Release --no-build

    - name: Run sample application
      run: dotnet run --project ${{ env.SampleProjectPath }} --configuration Release --no-build

    - name: Pack
      run: |
        VERSION_ARG=""
        if [ -n "${{ steps.get_version.outputs.version }}" ]; then
          VERSION_ARG="/p:Version=${{ steps.get_version.outputs.version }}"
        fi
        dotnet pack ${{ env.ProjectPath }} --configuration Release --no-build --output ${{ env.NugetOutputDir }} $VERSION_ARG
      shell: bash
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: build-artifacts
        path: |
          ${{ env.NugetOutputDir }}
          ./Src/Generator/bin/Release/netstandard2.0/HasFlagExtension.Generator.dll

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (inputs.version != '' && inputs.version != null)
    
    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts
        path: artifacts

    - name: NuGet Login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USERNAME || secrets.NUGET_USERNAME }}

    - name: Push to NuGet
      run: |
        find artifacts -type f -name "*.nupkg" ! -name "*.symbols.nupkg" | while read -r f; do
          dotnet nuget push "$f" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        done
      shell: bash
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (inputs.version != '' && inputs.version != null)
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Download Build Artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-artifacts
        path: artifacts

    - name: Generate Release Notes
      id: release_notes
      run: |
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        # Get commits from the beginning or previous tag.
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          git log --pretty=format:"* %s" >> $GITHUB_OUTPUT
        else
          git log $PREV_TAG..HEAD --pretty=format:"* %s" >> $GITHUB_OUTPUT
        fi
        echo "" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (needs.build.outputs.version != '' && format('v{0}', needs.build.outputs.version) || format('v{0}', inputs.version)) }}
        body: ${{ steps.release_notes.outputs.commits }}
        files: |
          artifacts/**/*.nupkg
          artifacts/**/HasFlagExtension.Generator.dll